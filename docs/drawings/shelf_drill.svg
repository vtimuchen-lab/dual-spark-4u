<text x="113.6" y="1036.4" font-size="10" font-family="sans-serif" text-anchor="start" fill="#111">X — от внутреннего края левой стойки, Y — от передней грани стоек. Под MSI и воздуховодами перфорацию заклеить снизу алюминиевым скотчем. Центры — shelf_drill_holes.csv.</text>
