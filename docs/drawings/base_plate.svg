<text x="83.6" y="920.0" font-size="10" font-family="sans-serif" text-anchor="start" fill="#111">Передний край плиты на 2 мм за задней плоскостью панели. Толщина 3 мм, алюминий. Отверстия Ø4.5 (M4) и Ø3.4 (M3).</text>
